<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TAP TEST – Avaliação de resposta à punção lombar na suspeita de Hidrocefalia de Pressão Normal. Dr. Hugo Ary Oliveira, Neurologista. CRM-DF 19610." />
    <link rel="icon" href="./assets/img/brain-vector.svg" />
    <title>TAP TEST – Dr. Hugo Ary Oliveira</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap');
      :root{--bg:#f7f9fc;--surface:#fff;--surface2:#f0f4f8;--border:#e2e8f0;--text:#1a2332;--text2:#4a5568;--text3:#8896a6;--accent:#2d7db0;--accent-light:#e4f0f8;--accent-dark:#1f5a82;--green:#5ba88c;--green-light:#e6f5ef;--green-dark:#3d7a62;--red:#c75a5a;--red-light:#fde8e8;--orange:#d4915e;--orange-light:#fef3e8;--shadow-sm:0 1px 3px rgba(26,35,50,.06);--shadow-md:0 4px 12px rgba(26,35,50,.08);--radius:10px;--radius-sm:6px;--font:'DM Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;}
      *{margin:0;padding:0;box-sizing:border-box;}
      body,html{font-family:var(--font);background:var(--bg);color:var(--text);}
      .app{max-width:1000px;margin:0 auto;padding:0 16px 60px;}
      .hdr{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--surface),#eaf3fb);border-bottom:1px solid var(--border);padding:16px 0;margin-bottom:24px;}
      .hdr-in{max-width:1000px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
      .hdr-brand{display:flex;align-items:center;gap:10px;}
      .hdr-icon{width:44px;height:44px;color:var(--accent);}
      .hdr-text h1{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.2;}
      .hdr-text p{font-size:10px;color:var(--text3);letter-spacing:.3px;font-weight:500;line-height:1.4;}
      .hdr-text .hdr-doc{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px;}
      .hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
      .btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
      .btn svg{width:16px;height:16px;}
      .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
      .btn-primary{background:var(--accent);color:#fff;}
      .btn-primary:hover{background:var(--accent-dark);}
      .btn-success{background:var(--green);color:#fff;}
      .btn-success:hover{background:var(--green-dark);}
      .btn-ghost{background:var(--surface2);color:var(--text2);border:1.5px solid var(--border);}
      .btn-ghost:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent);}
      .btn-danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
      .btn-danger:hover{background:var(--red-light);}
      .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow-sm);overflow:hidden;}
      .sec-hdr{display:flex;align-items:center;gap:10px;padding:14px 20px;background:linear-gradient(135deg,var(--accent-light),var(--surface));border-bottom:1px solid var(--border);}
      .sec-num{display:flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;background:var(--accent);color:#fff;border-radius:14px;font-size:11px;font-weight:700;font-family:var(--mono);flex-shrink:0;}
      .sec-title{font-size:15px;font-weight:600;letter-spacing:-.2px;}
      .sec-body{padding:20px;}
      .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
      .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
      .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
      .field{display:flex;flex-direction:column;gap:4px;}
      .field-wide{grid-column:1/-1;}
      .field-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
      input[type="text"],input[type="date"],input[type="number"],textarea,select{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:14px;color:var(--text);background:var(--surface);transition:all .2s;outline:none;width:100%;}
      input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,125,176,.12);}
      textarea{resize:vertical;min-height:60px;}
      .chips{display:flex;gap:4px;flex-wrap:wrap;}
      .chip{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-family:var(--font);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;}
      .chip:hover{border-color:var(--accent);color:var(--accent);}
      .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
      .tin-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:6px;}
      .tin-label{font-size:13px;line-height:1.4;}
      .tin-label b{font-weight:600;color:var(--text);}
      .tin-label small{display:block;color:var(--text3);font-size:11px;margin-top:2px;font-style:italic;}
      .tin-btns{display:flex;gap:4px;align-items:flex-start;}
      .tin-btn{min-width:32px;height:32px;padding:0 4px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;font-family:var(--mono);color:var(--text3);}
      .tin-btn:hover{border-color:var(--accent);color:var(--accent);}
      .tin-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
      .tin-total{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--accent-light);border-radius:var(--radius-sm);border:1.5px solid var(--accent);margin-top:8px;}
      .tin-total-label{font-size:13px;font-weight:700;color:var(--accent-dark);}
      .tin-total-val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent-dark);}
      .prepos-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
      .prepos-col{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
      .prepos-col h4{font-size:12px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent-light);}
      .alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-top:10px;display:flex;align-items:center;gap:8px;}
      .alert-warn{background:var(--orange-light);color:#8b5a2b;border-left:3px solid var(--orange);}
      .alert-ok{background:var(--green-light);color:var(--green-dark);border-left:3px solid var(--green);}
      .alert-danger{background:var(--red-light);color:#8b3a3a;border-left:3px solid var(--red);}
      .dash{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;box-shadow:var(--shadow-sm);overflow:hidden;}
      .dash-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:linear-gradient(135deg,#1a2332,var(--accent-dark));color:#fff;}
      .dash-title{font-size:15px;font-weight:700;letter-spacing:-.2px;}
      .dash-body{padding:20px;}
      .dash-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
      .dash-table th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.5px;background:var(--accent-light);border-bottom:2px solid var(--accent);}
      .dash-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);}
      .dash-table .center{text-align:center;}
      .dash-table .mono{font-family:var(--mono);font-weight:700;}
      .dash-verdict{padding:16px;border-radius:var(--radius-sm);text-align:center;font-size:16px;font-weight:700;letter-spacing:.5px;margin-top:8px;}
      .dash-verdict.positive{background:var(--green-light);color:var(--green-dark);border:2px solid var(--green);}
      .dash-verdict.negative{background:var(--red-light);color:#8b3a3a;border:2px solid var(--red);}
      .dash-verdict.indet{background:var(--orange-light);color:#8b5a2b;border:2px solid var(--orange);}
      .dash-verdict.empty{background:var(--surface2);color:var(--text3);border:2px dashed var(--border);}
      .refs{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
      .refs h3{font-size:14px;font-weight:700;color:var(--accent-dark);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;}
      .refs ol{padding-left:20px;}
      .refs li{font-size:12px;line-height:1.6;color:var(--text2);margin-bottom:6px;}
      /* PRINT PREVIEW */
      .pv-overlay{position:fixed;inset:0;background:var(--bg);z-index:1000;overflow-y:auto;}
      .pv-bar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm);z-index:10;}
      .pv-page{max-width:800px;margin:20px auto;background:#fff;padding:40px 48px;box-shadow:var(--shadow-md);font-size:12px;line-height:1.5;}
      .pv-title{text-align:center;font-size:18px;font-weight:700;margin-bottom:24px;text-decoration:underline;}
      .pv-sec{margin-bottom:18px;break-inside:avoid;}
      .pv-sec-h{font-weight:700;font-size:13px;background:#f0f0f0;padding:6px 10px;border:1px solid #999;text-align:center;}
      .pv-table{width:100%;border-collapse:collapse;border:1px solid #333;}
      .pv-table td,.pv-table th{border:1px solid #333;padding:6px 10px;vertical-align:top;font-size:11.5px;}
      .pv-table th{background:#f0f0f0;font-weight:700;text-align:center;}
      .pv-foot{margin-top:32px;font-size:11.5px;line-height:1.6;}
      @media print{
        .no-print{display:none!important;}
        .pv-overlay{position:static;background:#fff;}
        .pv-page{margin:0;padding:20px;box-shadow:none;max-width:none;}
        body,html{background:#fff;}
        @page{margin:15mm;}
      }
      @media (max-width:720px){
        .grid-2,.grid-3,.grid-4,.prepos-grid{grid-template-columns:1fr;}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useRef, useMemo } = React;

      /* ═══ CONSTANTS ═══ */
      const TINETTI_BALANCE = [
        {k:"b1",label:"Equilíbrio sentado",hint:"Sujeito sentado em cadeira rígida, sem braços",opts:[{v:0,t:"Inclina-se ou desliza"},{v:1,t:"Estável, seguro"}]},
        {k:"b2",label:"Levanta-se da cadeira",opts:[{v:0,t:"Incapaz sem ajuda"},{v:1,t:"Usa membros superiores"},{v:2,t:"Sem usar membros superiores"}]},
        {k:"b3",label:"Tentativas para se levantar",opts:[{v:0,t:"Incapaz sem ajuda"},{v:1,t:"Mais de uma tentativa"},{v:2,t:"Uma tentativa"}]},
        {k:"b4",label:"Equilíbrio de pé imediato (primeiros 5s)",opts:[{v:0,t:"Instável"},{v:1,t:"Estável c/ dispositivo"},{v:2,t:"Estável sem dispositivo"}]},
        {k:"b5",label:"Equilíbrio de pé",opts:[{v:0,t:"Instável"},{v:1,t:"Base ampliada / dispositivo"},{v:2,t:"Base reduzida sem dispositivo"}]},
        {k:"b6",label:"Desequilíbrio no esterno",hint:"Examinador empurra o esterno 3× com a palma",opts:[{v:0,t:"Começa a cair"},{v:1,t:"Cambaleia, se agarra"},{v:2,t:"Estável"}]},
        {k:"b7",label:"Olhos fechados",opts:[{v:0,t:"Instável"},{v:1,t:"Estável"}]},
        {k:"b8",label:"Girar 360°",opts:[{v:0,t:"Instabilidade"},{v:1,t:"Passos descontínuos"},{v:2,t:"Continuidade"}]},
        {k:"b9",label:"Sentar-se",opts:[{v:0,t:"Inseguro / cai"},{v:1,t:"Usa os braços"},{v:2,t:"Seguro, movimentos suaves"}]},
      ];
      const TINETTI_GAIT = [
        {k:"g1",label:"Iniciação da marcha",opts:[{v:0,t:"Hesitação / múltiplas tentativas"},{v:1,t:"Sem hesitação"}]},
        {k:"g2a",label:"Perna D – passa o membro E",opts:[{v:0,t:"Não passa"},{v:1,t:"Passa"}]},
        {k:"g2b",label:"Perna D – afasta do solo",opts:[{v:0,t:"Não afasta completamente"},{v:1,t:"Afasta completamente"}]},
        {k:"g2c",label:"Perna E – passa o membro D",opts:[{v:0,t:"Não passa"},{v:1,t:"Passa"}]},
        {k:"g2d",label:"Perna E – afasta do solo",opts:[{v:0,t:"Não afasta completamente"},{v:1,t:"Afasta completamente"}]},
        {k:"g3",label:"Simetria do passo",opts:[{v:0,t:"Passos desiguais"},{v:1,t:"Passos iguais"}]},
        {k:"g4",label:"Continuidade do passo",opts:[{v:0,t:"Parada / descontinuidade"},{v:1,t:"Passos contínuos"}]},
        {k:"g5",label:"Desvio da linha reta (≈ 3m × 30cm)",opts:[{v:0,t:"Desvio marcado"},{v:1,t:"Desvio leve ou dispositivo"},{v:2,t:"Linha reta sem dispositivo"}]},
        {k:"g6",label:"Tronco",opts:[{v:0,t:"Oscilação / dispositivo"},{v:1,t:"Flexão joelhos/dor ou afasta braços"},{v:2,t:"Sem oscilação ou flexão"}]},
        {k:"g7",label:"Base de apoio",opts:[{v:0,t:"Calcanhares afastados"},{v:1,t:"Calcanhares quase tocando"}]},
      ];
      const BAL_MAX = 16, GAIT_MAX = 12, TIN_MAX = 28;

      const INITIAL_DATA = {
        initials:"", birthdate:"", age:"", gender:"", schooling:"",
        requestingDoctor:"", indication:"Suspeita de HPN", evalDate:new Date().toISOString().split("T")[0], location:"",
        comorbidities:"", medications:"", companion:"", clinicalHistory:"",
        triad_gait_time:"", triad_gait_note:"",
        triad_sphincter_time:"", triad_sphincter_note:"",
        triad_cognitive_time:"", triad_cognitive_note:"",
        mri_date:"", mri_mta:"", mri_fazekas:"", mri_callosal:"", mri_desh:"", mri_evans:"", mri_notes:"",
        pre_tug:"", pos_tug:"",
        pre_bal:{}, pre_gait:{}, pos_bal:{}, pos_gait:{},
        pl_space:"L3-L4", pl_needle:"22G", pl_attempts:"1", pl_aspect:"Água de rocha", pl_pressure:"", pl_volume:"", pl_anesthesia:"Lidocaína 2% sem vasoconstritor (2ml)", pl_notes:"",
        conclusion:"", conclusion_manual:false,
        examiner:"Dr Hugo Ary O R Silva — Neurologista, Especialidade Cognição e Comportamento — CRM-DF 19610 — RQE 17.996",
      };

      /* ═══ HELPERS ═══ */
      const N = (v) => { const x = parseFloat(v); return isNaN(x) ? null : x; };
      const V = (v) => (v || v === 0) ? v : "—";

      function calcAge(birthdate, refDate) {
        if (!birthdate) return "";
        const b = new Date(birthdate), r = refDate ? new Date(refDate) : new Date();
        if (isNaN(b.getTime())) return "";
        let age = r.getFullYear() - b.getFullYear();
        const m = r.getMonth() - b.getMonth();
        if (m < 0 || (m === 0 && r.getDate() < b.getDate())) age--;
        return age >= 0 ? String(age) : "";
      }

      function sumScores(obj, list) {
        return list.reduce((acc, it) => {
          const v = obj[it.k];
          return acc + (typeof v === "number" ? v : 0);
        }, 0);
      }

      function filledCount(obj, list) {
        return list.reduce((acc, it) => acc + (typeof obj[it.k] === "number" ? 1 : 0), 0);
      }

      function fmtDate(d) {
        if (!d) return "—";
        const [y, m, day] = d.split("-");
        return `${day}/${m}/${y}`;
      }

      function pct(pre, pos) {
        if (pre === null || pos === null || pre === 0) return null;
        return ((pre - pos) / pre) * 100;
      }

      function classifyResponse(pre_tug, pos_tug, pre_tin, pos_tin) {
        const tugDelta = (pre_tug !== null && pos_tug !== null) ? pre_tug - pos_tug : null;
        const tugPct = pct(pre_tug, pos_tug);
        const tinDelta = (pre_tin !== null && pos_tin !== null) ? pos_tin - pre_tin : null;
        const tinPct = (pre_tin !== null && pos_tin !== null && pre_tin > 0) ? ((pos_tin - pre_tin) / pre_tin) * 100 : null;
        const hasTUG = tugDelta !== null;
        const hasTIN = tinDelta !== null;
        if (!hasTUG && !hasTIN) return { verdict:"empty", label:"Preencha pré e pós para gerar classificação", tugDelta, tugPct, tinDelta, tinPct };
        // Critérios (Mori 2012 / Wikkelsø 2013):
        // TUG: melhora ≥ 20% OU redução ≥ 5 segundos
        // Tinetti: ganho ≥ 2 pontos OU ≥ 10%
        const tugPositive = hasTUG && (tugPct >= 20 || tugDelta >= 5);
        const tinPositive = hasTIN && (tinDelta >= 2 || (tinPct !== null && tinPct >= 10));
        const tugLimit = hasTUG && !tugPositive && (tugPct >= 10 || tugDelta >= 2);
        const tinLimit = hasTIN && !tinPositive && tinDelta >= 1;
        if (tugPositive || tinPositive) return { verdict:"positive", label:"TAP TEST — RESPONDEDOR", tugDelta, tugPct, tinDelta, tinPct };
        if (tugLimit || tinLimit) return { verdict:"indet", label:"TAP TEST — RESPOSTA LIMÍTROFE", tugDelta, tugPct, tinDelta, tinPct };
        return { verdict:"negative", label:"TAP TEST — NÃO RESPONDEDOR", tugDelta, tugPct, tinDelta, tinPct };
      }

      /* ═══ UI COMPONENTS ═══ */
      function Section({ number, title, children }) {
        return (
          <section className="section">
            <div className="sec-hdr">
              <span className="sec-num">{number}</span>
              <h2 className="sec-title">{title}</h2>
            </div>
            <div className="sec-body">{children}</div>
          </section>
        );
      }

      function Field({ label, children, wide }) {
        return (
          <div className={`field ${wide ? "field-wide" : ""}`}>
            {label && <label className="field-label">{label}</label>}
            {children}
          </div>
        );
      }

      function Chips({ options, value, onChange }) {
        return (
          <div className="chips">
            {options.map(o => (
              <button key={o} type="button" className={`chip ${value === o ? "active" : ""}`} onClick={() => onChange(value === o ? "" : o)}>{o}</button>
            ))}
          </div>
        );
      }

      function TinettiBlock({ items, values, onChange, label, max }) {
        const filled = filledCount(values, items);
        const score = sumScores(values, items);
        return (
          <div>
            {items.map(it => (
              <div key={it.k} className="tin-item">
                <div className="tin-label">
                  <b>{it.label}</b>
                  {it.hint && <small>{it.hint}</small>}
                </div>
                <div className="tin-btns">
                  {it.opts.map(op => (
                    <button key={op.v} type="button" title={op.t}
                      className={`tin-btn ${values[it.k] === op.v ? "active" : ""}`}
                      onClick={() => onChange(it.k, values[it.k] === op.v ? undefined : op.v)}>
                      {op.v}
                    </button>
                  ))}
                </div>
              </div>
            ))}
            <div className="tin-total">
              <span className="tin-total-label">{label} — {filled}/{items.length} itens</span>
              <span className="tin-total-val">{score} / {max}</span>
            </div>
          </div>
        );
      }

      const WaterDropIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.5c-.4 0-.77.2-.99.53C9.1 5.8 4.5 12.6 4.5 16.5c0 4.14 3.36 7.5 7.5 7.5s7.5-3.36 7.5-7.5c0-3.9-4.6-10.7-6.51-13.47A1.19 1.19 0 0 0 12 2.5Zm0 18c-2.21 0-4-1.79-4-4 0-.55.45-1 1-1s1 .45 1 1c0 1.1.9 2 2 2 .55 0 1 .45 1 1s-.45 1-1 1Z"/>
        </svg>
      );

      /* ═══ MAIN APP ═══ */
      function TapTestApp() {
        const [data, setData] = useState(() => {
          try {
            const saved = localStorage.getItem("tap_test_draft");
            if (saved) return { ...INITIAL_DATA, ...JSON.parse(saved) };
          } catch(e) {}
          return INITIAL_DATA;
        });
        const [showPrint, setShowPrint] = useState(false);
        const fileInputRef = useRef(null);

        // Persist to localStorage
        useEffect(() => {
          try { localStorage.setItem("tap_test_draft", JSON.stringify(data)); } catch(e) {}
        }, [data]);

        // Auto-calculate age
        useEffect(() => {
          const age = calcAge(data.birthdate, data.evalDate);
          if (age !== data.age) setData(p => ({ ...p, age }));
          // eslint-disable-next-line
        }, [data.birthdate, data.evalDate]);

        const set = (k, v) => setData(p => ({ ...p, [k]: v }));
        const setNested = (group, k, v) => setData(p => {
          const n = { ...p[group] };
          if (v === undefined) delete n[k]; else n[k] = v;
          return { ...p, [group]: n };
        });

        // Computed scores
        const preBal = sumScores(data.pre_bal, TINETTI_BALANCE);
        const preGait = sumScores(data.pre_gait, TINETTI_GAIT);
        const preTin = preBal + preGait;
        const posBal = sumScores(data.pos_bal, TINETTI_BALANCE);
        const posGait = sumScores(data.pos_gait, TINETTI_GAIT);
        const posTin = posBal + posGait;
        const preTUG = N(data.pre_tug);
        const posTUG = N(data.pos_tug);

        const preFilled = filledCount(data.pre_bal, TINETTI_BALANCE) + filledCount(data.pre_gait, TINETTI_GAIT);
        const posFilled = filledCount(data.pos_bal, TINETTI_BALANCE) + filledCount(data.pos_gait, TINETTI_GAIT);
        const hasPre = preFilled > 0 || preTUG !== null;
        const hasPos = posFilled > 0 || posTUG !== null;

        const resp = classifyResponse(
          preTUG, posTUG,
          preFilled > 0 ? preTin : null,
          posFilled > 0 ? posTin : null
        );

        // Alert flags (imaging/PL)
        const evansNum = N(data.mri_evans);
        const evansAlert = evansNum !== null && evansNum > 0.33;
        const pressureNum = N(data.pl_pressure);
        const pressureAlert = pressureNum !== null && pressureNum > 26;
        const deshPresent = data.mri_desh === "Presente";

        // Auto-generate conclusion
        useEffect(() => {
          if (data.conclusion_manual) return;
          let text = "";
          if (hasPre || hasPos) {
            const volTxt = data.pl_volume ? `${data.pl_volume} ml` : "do líquor";
            text += `Através deste TAP TEST foi observado que após a retirada de ${volTxt} de líquor `;
            if (resp.verdict === "positive") {
              text += "houve melhora clínica significativa nos testes de marcha e equilíbrio, compatível com resposta positiva à punção lombar.\n\n";
              text += "TAP TEST — RESPONDEDOR";
            } else if (resp.verdict === "negative") {
              text += "não houve melhora limítrofe significativa dos testes de marcha e equilíbrio após a punção lombar.\n\n";
              text += "TAP TEST — NÃO RESPONDEDOR";
            } else if (resp.verdict === "indet") {
              text += "houve melhora marginal dos parâmetros de marcha e equilíbrio, sem atingir os critérios clássicos de resposta ao TAP TEST.\n\n";
              text += "TAP TEST — RESPOSTA LIMÍTROFE";
            }
          }
          if (text !== data.conclusion) setData(p => ({ ...p, conclusion: text }));
          // eslint-disable-next-line
        }, [resp.verdict, data.pl_volume, hasPre, hasPos]);

        function doPrint() { setShowPrint(true); }
        function clearAll() {
          if (confirm("Limpar todos os campos? Esta ação não pode ser desfeita.")) {
            setData({ ...INITIAL_DATA, evalDate: new Date().toISOString().split("T")[0] });
          }
        }
        function saveJSON() {
          const name = data.initials ? data.initials.trim().replace(/\s+/g, "_") : "tap_test";
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = `${name}_${data.evalDate || "rascunho"}.json`; a.click();
          URL.revokeObjectURL(url);
        }
        function loadJSON(e) {
          const file = e.target.files[0]; if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const loaded = JSON.parse(ev.target.result);
              setData({ ...INITIAL_DATA, ...loaded });
            } catch(err) { alert("Arquivo inválido."); }
          };
          reader.readAsText(file);
          e.target.value = "";
        }
        function copyReport() {
          const txt = buildPlainReport(data, { preBal, preGait, preTin, posBal, posGait, posTin, preTUG, posTUG, resp });
          navigator.clipboard.writeText(txt).then(() => alert("Relatório copiado para a área de transferência."));
        }

        return (
          <>
            <header className="hdr no-print">
              <div className="hdr-in">
                <div className="hdr-brand">
                  <WaterDropIcon className="hdr-icon" />
                  <div className="hdr-text">
                    <h1>TAP TEST</h1>
                    <p>AVALIAÇÃO DE RESPOSTA À PUNÇÃO LOMBAR</p>
                    <p className="hdr-doc">Dr. Hugo Ary Oliveira · CRM-DF 19610 · RQE 17996</p>
                  </div>
                </div>
                <div className="hdr-actions">
                  <a href="./index.html" className="btn btn-ghost" style={{textDecoration:"none"}}>← Início</a>
                  <input type="file" ref={fileInputRef} onChange={loadJSON} style={{display:"none"}} accept=".json"/>
                  <button className="btn btn-ghost" onClick={() => fileInputRef.current.click()}>Carregar</button>
                  <button className="btn btn-success" onClick={saveJSON}>Salvar</button>
                  <button className="btn btn-primary" onClick={doPrint}>Imprimir</button>
                  <button className="btn btn-danger" onClick={clearAll} title="Limpar todos os campos">Limpar</button>
                </div>
              </div>
            </header>

            <main className="app">
              <Section number="1" title="Identificação do Paciente">
                <div className="grid-3">
                  <Field label="Nome / Iniciais"><input type="text" value={data.initials} onChange={e => set("initials", e.target.value)} placeholder="Ex.: R.A.R." /></Field>
                  <Field label="Data de Nascimento"><input type="date" value={data.birthdate} onChange={e => set("birthdate", e.target.value)} /></Field>
                  <Field label="Idade"><input type="text" value={data.age} readOnly style={{background:"var(--surface2)"}} placeholder="(automático)" /></Field>
                  <Field label="Sexo"><Chips options={["Feminino","Masculino","Outro"]} value={data.gender} onChange={v => set("gender", v)} /></Field>
                  <Field label="Escolaridade">
                    <select value={data.schooling} onChange={e => set("schooling", e.target.value)}>
                      <option value="">Selecionar...</option>
                      <option>Analfabeto</option>
                      <option>Ensino Fundamental Incompleto</option>
                      <option>Ensino Fundamental Completo</option>
                      <option>Ensino Médio Incompleto</option>
                      <option>Ensino Médio Completo</option>
                      <option>Ensino Superior Incompleto</option>
                      <option>Ensino Superior Completo</option>
                      <option>Pós-graduação</option>
                    </select>
                  </Field>
                  <Field label="Data da Avaliação"><input type="date" value={data.evalDate} onChange={e => set("evalDate", e.target.value)} /></Field>
                  <Field label="Médico Solicitante"><input type="text" value={data.requestingDoctor} onChange={e => set("requestingDoctor", e.target.value)} placeholder="Nome do médico" /></Field>
                  <Field label="Indicação"><input type="text" value={data.indication} onChange={e => set("indication", e.target.value)} /></Field>
                  <Field label="Local">
                    <select value={data.location} onChange={e => set("location", e.target.value)}>
                      <option value="">Selecionar...</option>
                      <option>Neurostart</option>
                      <option>Centro de Aneurisma Cerebral</option>
                      <option>Centro Médico Santa Luzia</option>
                      <option>Hospital DF Star</option>
                      <option>Outro</option>
                    </select>
                  </Field>
                  <Field label="Comorbidades" wide><input type="text" value={data.comorbidities} onChange={e => set("comorbidities", e.target.value)} placeholder="Ex.: DM, HAS, depressão" /></Field>
                  <Field label="Medicações em uso" wide><input type="text" value={data.medications} onChange={e => set("medications", e.target.value)} placeholder="Ex.: levotiroxina, quetiapina 200mg, trazodona 50mg" /></Field>
                  <Field label="Acompanhante" wide><input type="text" value={data.companion} onChange={e => set("companion", e.target.value)} placeholder="Ex.: irmã, filho, cônjuge" /></Field>
                  <Field label="História Clínica / Queixas adicionais" wide><textarea value={data.clinicalHistory} onChange={e => set("clinicalHistory", e.target.value)} placeholder="Descrição livre do quadro clínico, antecedentes, evolução..."/></Field>
                </div>
              </Section>

              <Section number="2" title="Tríade de Hakim-Adams">
                <div className="grid-2">
                  <Field label="Alteração da marcha — tempo / características" wide><input type="text" value={data.triad_gait_time} onChange={e => set("triad_gait_time", e.target.value)} placeholder="Ex.: há 3 anos, inespecífica de longa data" /></Field>
                  <Field label="Observações sobre a marcha" wide><input type="text" value={data.triad_gait_note} onChange={e => set("triad_gait_note", e.target.value)} placeholder="Ex.: marcha magnética, passos curtos, dificuldade transitória..." /></Field>
                  <Field label="Alteração esfincteriana — tempo" wide><input type="text" value={data.triad_sphincter_time} onChange={e => set("triad_sphincter_time", e.target.value)} placeholder="Ex.: há 10 anos" /></Field>
                  <Field label="Observações esfincterianas" wide><input type="text" value={data.triad_sphincter_note} onChange={e => set("triad_sphincter_note", e.target.value)} placeholder="Ex.: urgeincontinência com melhora após spasmex" /></Field>
                  <Field label="Déficit cognitivo amnéstico — tempo" wide><input type="text" value={data.triad_cognitive_time} onChange={e => set("triad_cognitive_time", e.target.value)} placeholder="Ex.: sem queixa consistente" /></Field>
                  <Field label="Observações cognitivas" wide><input type="text" value={data.triad_cognitive_note} onChange={e => set("triad_cognitive_note", e.target.value)} placeholder="Ex.: síndrome amnéstica sem queixa consistente" /></Field>
                </div>
              </Section>

              <Section number="3" title="Neuroimagem">
                <div className="grid-3">
                  <Field label="Data da RM"><input type="date" value={data.mri_date} onChange={e => set("mri_date", e.target.value)} /></Field>
                  <Field label="MTA (0–4) — Scheltens">
                    <select value={data.mri_mta} onChange={e => set("mri_mta", e.target.value)}>
                      <option value="">—</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
                    </select>
                  </Field>
                  <Field label="Fazekas (0–3)">
                    <select value={data.mri_fazekas} onChange={e => set("mri_fazekas", e.target.value)}>
                      <option value="">—</option><option>0</option><option>1</option><option>2</option><option>3</option>
                    </select>
                  </Field>
                  <Field label="Ângulo do corpo caloso (graus)"><input type="number" step="0.1" value={data.mri_callosal} onChange={e => set("mri_callosal", e.target.value)} placeholder="Ex.: 96" /></Field>
                  <Field label="DESH">
                    <select value={data.mri_desh} onChange={e => set("mri_desh", e.target.value)}>
                      <option value="">—</option><option>Presente</option><option>Ausente</option><option>Indefinido</option>
                    </select>
                  </Field>
                  <Field label="Índice de Evans"><input type="number" step="0.01" value={data.mri_evans} onChange={e => set("mri_evans", e.target.value)} placeholder="Ex.: 0.36" /></Field>
                  <Field label="Observações de imagem" wide><textarea value={data.mri_notes} onChange={e => set("mri_notes", e.target.value)} placeholder="Ex.: laudo não menciona DESH, mas padrão presente na avaliação visual..."/></Field>
                </div>
                {evansAlert && <div className="alert alert-warn">⚠ Índice de Evans &gt; 0,33 — critério de ventriculomegalia compatível com HPN.</div>}
                {deshPresent && <div className="alert alert-warn">⚠ Padrão DESH presente — reforça suspeita de HPN idiopática.</div>}
              </Section>

              <Section number="4" title="Avaliação Funcional — PRÉ Punção Lombar">
                <div className="grid-2">
                  <Field label="Timed Up and Go (TUG) — pré PL"><div style={{display:"flex",gap:8,alignItems:"center"}}><input type="number" step="0.1" value={data.pre_tug} onChange={e => set("pre_tug", e.target.value)} placeholder="segundos" /><span style={{color:"var(--text3)",fontSize:13}}>s (andar 10 m)</span></div></Field>
                  <Field label="Escore Tinetti pré — parcial"><div style={{padding:"8px 12px",background:"var(--surface2)",borderRadius:"var(--radius-sm)",fontFamily:"var(--mono)",fontWeight:700,color:"var(--accent-dark)"}}>{preTin} / {TIN_MAX}  <span style={{fontSize:11,color:"var(--text3)",fontWeight:400,marginLeft:8}}>(Eq: {preBal}/{BAL_MAX} · Marcha: {preGait}/{GAIT_MAX})</span></div></Field>
                </div>
                <h3 style={{fontSize:13,fontWeight:700,color:"var(--accent-dark)",textTransform:"uppercase",letterSpacing:".5px",margin:"16px 0 8px"}}>Tinetti — Equilíbrio (máx. 16)</h3>
                <TinettiBlock items={TINETTI_BALANCE} values={data.pre_bal} onChange={(k,v) => setNested("pre_bal", k, v)} label="Escore Equilíbrio" max={BAL_MAX} />
                <h3 style={{fontSize:13,fontWeight:700,color:"var(--accent-dark)",textTransform:"uppercase",letterSpacing:".5px",margin:"16px 0 8px"}}>Tinetti — Marcha (máx. 12)</h3>
                <TinettiBlock items={TINETTI_GAIT} values={data.pre_gait} onChange={(k,v) => setNested("pre_gait", k, v)} label="Escore Marcha" max={GAIT_MAX} />
              </Section>

              <Section number="5" title="Punção Lombar">
                <div className="grid-3">
                  <Field label="Espaço"><input type="text" value={data.pl_space} onChange={e => set("pl_space", e.target.value)} placeholder="L3-L4" /></Field>
                  <Field label="Agulha"><input type="text" value={data.pl_needle} onChange={e => set("pl_needle", e.target.value)} placeholder="22G" /></Field>
                  <Field label="Tentativas"><input type="number" value={data.pl_attempts} onChange={e => set("pl_attempts", e.target.value)} placeholder="1" /></Field>
                  <Field label="Aspecto do líquor">
                    <select value={data.pl_aspect} onChange={e => set("pl_aspect", e.target.value)}>
                      <option>Água de rocha</option>
                      <option>Límpido</option>
                      <option>Turvo</option>
                      <option>Xantocrômico</option>
                      <option>Hemorrágico</option>
                    </select>
                  </Field>
                  <Field label="Pressão de abertura (cmH₂O)"><input type="number" step="0.1" value={data.pl_pressure} onChange={e => set("pl_pressure", e.target.value)} placeholder="Ex.: 17" /></Field>
                  <Field label="Volume coletado (ml)"><input type="number" value={data.pl_volume} onChange={e => set("pl_volume", e.target.value)} placeholder="Ex.: 30" /></Field>
                  <Field label="Anestesia local" wide><input type="text" value={data.pl_anesthesia} onChange={e => set("pl_anesthesia", e.target.value)} /></Field>
                  <Field label="Observações do procedimento" wide><textarea value={data.pl_notes} onChange={e => set("pl_notes", e.target.value)} placeholder="Ex.: posicionamento em DLE, antissepsia adequada, líquor enviado em 3 frascos..."/></Field>
                </div>
                {pressureAlert && <div className="alert alert-danger">⚠ Pressão de abertura &gt; 26 cmH₂O — valor acima do limite superior de referência deste serviço. Reavaliar hipótese de HPN idiopática.</div>}
                {pressureNum !== null && !pressureAlert && <div className="alert alert-ok">✓ Pressão de abertura dentro do limite de referência (≤ 26 cmH₂O).</div>}
              </Section>

              <Section number="6" title="Avaliação Funcional — PÓS Punção Lombar">
                <div className="grid-2">
                  <Field label="Timed Up and Go (TUG) — pós PL"><div style={{display:"flex",gap:8,alignItems:"center"}}><input type="number" step="0.1" value={data.pos_tug} onChange={e => set("pos_tug", e.target.value)} placeholder="segundos" /><span style={{color:"var(--text3)",fontSize:13}}>s (andar 10 m)</span></div></Field>
                  <Field label="Escore Tinetti pós — parcial"><div style={{padding:"8px 12px",background:"var(--surface2)",borderRadius:"var(--radius-sm)",fontFamily:"var(--mono)",fontWeight:700,color:"var(--accent-dark)"}}>{posTin} / {TIN_MAX}  <span style={{fontSize:11,color:"var(--text3)",fontWeight:400,marginLeft:8}}>(Eq: {posBal}/{BAL_MAX} · Marcha: {posGait}/{GAIT_MAX})</span></div></Field>
                </div>
                <h3 style={{fontSize:13,fontWeight:700,color:"var(--accent-dark)",textTransform:"uppercase",letterSpacing:".5px",margin:"16px 0 8px"}}>Tinetti — Equilíbrio (máx. 16)</h3>
                <TinettiBlock items={TINETTI_BALANCE} values={data.pos_bal} onChange={(k,v) => setNested("pos_bal", k, v)} label="Escore Equilíbrio" max={BAL_MAX} />
                <h3 style={{fontSize:13,fontWeight:700,color:"var(--accent-dark)",textTransform:"uppercase",letterSpacing:".5px",margin:"16px 0 8px"}}>Tinetti — Marcha (máx. 12)</h3>
                <TinettiBlock items={TINETTI_GAIT} values={data.pos_gait} onChange={(k,v) => setNested("pos_gait", k, v)} label="Escore Marcha" max={GAIT_MAX} />
              </Section>

              <div className="dash">
                <div className="dash-hdr"><span className="dash-title">Σ Dashboard — Resposta ao TAP TEST</span></div>
                <div className="dash-body">
                  <table className="dash-table">
                    <thead>
                      <tr><th>Parâmetro</th><th className="center">Pré PL</th><th className="center">Pós PL</th><th className="center">Δ absoluto</th><th className="center">Δ %</th></tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td><b>Timed Up and Go (TUG)</b><br/><span style={{fontSize:11,color:"var(--text3)"}}>segundos — 10 m</span></td>
                        <td className="center mono">{preTUG !== null ? preTUG.toFixed(1) + " s" : "—"}</td>
                        <td className="center mono">{posTUG !== null ? posTUG.toFixed(1) + " s" : "—"}</td>
                        <td className="center mono">{resp.tugDelta !== null ? `${resp.tugDelta > 0 ? "−" : "+"}${Math.abs(resp.tugDelta).toFixed(1)} s` : "—"}</td>
                        <td className="center mono">{resp.tugPct !== null ? `${resp.tugPct > 0 ? "−" : "+"}${Math.abs(resp.tugPct).toFixed(1)}%` : "—"}</td>
                      </tr>
                      <tr>
                        <td><b>Tinetti — Equilíbrio</b><br/><span style={{fontSize:11,color:"var(--text3)"}}>máx. {BAL_MAX}</span></td>
                        <td className="center mono">{preFilled > 0 ? `${preBal}/${BAL_MAX}` : "—"}</td>
                        <td className="center mono">{posFilled > 0 ? `${posBal}/${BAL_MAX}` : "—"}</td>
                        <td className="center mono">{(preFilled > 0 && posFilled > 0) ? `${posBal - preBal >= 0 ? "+" : ""}${posBal - preBal}` : "—"}</td>
                        <td className="center mono">—</td>
                      </tr>
                      <tr>
                        <td><b>Tinetti — Marcha</b><br/><span style={{fontSize:11,color:"var(--text3)"}}>máx. {GAIT_MAX}</span></td>
                        <td className="center mono">{preFilled > 0 ? `${preGait}/${GAIT_MAX}` : "—"}</td>
                        <td className="center mono">{posFilled > 0 ? `${posGait}/${GAIT_MAX}` : "—"}</td>
                        <td className="center mono">{(preFilled > 0 && posFilled > 0) ? `${posGait - preGait >= 0 ? "+" : ""}${posGait - preGait}` : "—"}</td>
                        <td className="center mono">—</td>
                      </tr>
                      <tr style={{background:"var(--accent-light)"}}>
                        <td><b>Tinetti — TOTAL</b><br/><span style={{fontSize:11,color:"var(--text3)"}}>máx. {TIN_MAX}</span></td>
                        <td className="center mono">{preFilled > 0 ? `${preTin}/${TIN_MAX}` : "—"}</td>
                        <td className="center mono">{posFilled > 0 ? `${posTin}/${TIN_MAX}` : "—"}</td>
                        <td className="center mono">{resp.tinDelta !== null ? `${resp.tinDelta >= 0 ? "+" : ""}${resp.tinDelta}` : "—"}</td>
                        <td className="center mono">{resp.tinPct !== null ? `${resp.tinPct >= 0 ? "+" : ""}${resp.tinPct.toFixed(1)}%` : "—"}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div className={`dash-verdict ${resp.verdict}`}>{resp.label}</div>
                  <p style={{fontSize:11,color:"var(--text3)",marginTop:10,lineHeight:1.6}}>
                    <b>Critérios de resposta (Mori 2012 / Wikkelsø 2013):</b> RESPONDEDOR quando TUG melhora ≥ 20% ou ≥ 5s, OU Tinetti ganha ≥ 2 pontos / ≥ 10%. LIMÍTROFE com melhora menor. NÃO RESPONDEDOR sem melhora significativa.
                  </p>
                </div>
              </div>

              <Section number="7" title="Conclusão">
                <Field label="Texto da conclusão (editável)" wide>
                  <textarea rows={6} value={data.conclusion}
                    onChange={e => setData(p => ({ ...p, conclusion: e.target.value, conclusion_manual: true }))}
                    placeholder="Texto gerado automaticamente a partir dos resultados..."/>
                </Field>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,flexWrap:"wrap",gap:8}}>
                  <label style={{fontSize:12,color:"var(--text2)",display:"flex",alignItems:"center",gap:6}}>
                    <input type="checkbox" checked={!data.conclusion_manual}
                      onChange={e => setData(p => ({ ...p, conclusion_manual: !e.target.checked }))}
                      style={{width:"auto"}} />
                    Atualizar automaticamente com base nos escores
                  </label>
                  <button className="btn btn-ghost" onClick={copyReport}>Copiar relatório completo</button>
                </div>
                <Field label="Assinatura / Examinador" wide>
                  <textarea rows={3} value={data.examiner} onChange={e => set("examiner", e.target.value)} />
                </Field>
              </Section>

              <div className="refs">
                <h3>Referências Bibliográficas</h3>
                <ol>{REFERENCES.map((r, i) => <li key={i}>{r}</li>)}</ol>
              </div>
            </main>

            {showPrint && <PrintPreview data={data} computed={{preBal, preGait, preTin, posBal, posGait, posTin, preTUG, posTUG, resp}} onClose={() => setShowPrint(false)} />}
          </>
        );
      }

      /* ═══ PRINT PREVIEW ═══ */
      function PrintPreview({ data, computed, onClose }) {
        const { preBal, preGait, preTin, posBal, posGait, posTin, preTUG, posTUG, resp } = computed;
        useEffect(() => {
          const handler = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", handler);
          return () => window.removeEventListener("keydown", handler);
        }, [onClose]);

        const doPrint = () => setTimeout(() => window.print(), 100);

        const renderTinettiRows = (items, pre, pos) => items.map(it => (
          <tr key={it.k}>
            <td>{it.label}</td>
            <td className="center">{typeof pre[it.k] === "number" ? pre[it.k] : "—"}</td>
            <td className="center">{typeof pos[it.k] === "number" ? pos[it.k] : "—"}</td>
          </tr>
        ));

        return (
          <div className="pv-overlay">
            <div className="pv-bar no-print">
              <button className="btn btn-ghost" onClick={onClose}>← Voltar ao formulário</button>
              <span style={{fontSize:13,fontWeight:600,color:"var(--text2)"}}>Pré-visualização do Relatório</span>
              <button className="btn btn-primary" onClick={doPrint}>Imprimir / Salvar PDF</button>
            </div>
            <div className="pv-page">
              <div className="pv-title">Relatório – TAP TEST</div>

              <table className="pv-table" style={{marginBottom:18}}>
                <tbody>
                  <tr><th colSpan="4">TAP TEST</th></tr>
                  <tr><td colSpan="4"><b>Nome:</b> {V(data.initials)}</td></tr>
                  <tr>
                    <td><b>Data Nasc.</b><br/>{fmtDate(data.birthdate)}</td>
                    <td><b>Idade:</b><br/>{V(data.age)} {data.age ? "anos" : ""}</td>
                    <td><b>Sexo:</b><br/>{V(data.gender)}</td>
                    <td><b>Escolaridade:</b><br/>{V(data.schooling)}</td>
                  </tr>
                  <tr><td colSpan="4"><b>Médico solicitante:</b> {V(data.requestingDoctor)}</td></tr>
                  <tr><td colSpan="4"><b>Indicação:</b> {V(data.indication)}</td></tr>
                  <tr><td colSpan="2"><b>Data da Avaliação:</b> {fmtDate(data.evalDate)}</td><td colSpan="2"><b>Local:</b> {V(data.location)}</td></tr>
                  <tr><td colSpan="4"><b>Comorbidades:</b> {V(data.comorbidities)}</td></tr>
                  <tr><td colSpan="4"><b>Medicações em uso:</b> {V(data.medications)}</td></tr>
                  <tr><td colSpan="4">
                    <b>História Clínica:</b><br/>
                    {data.companion && <>Acompanhante — {data.companion}<br/></>}
                    {data.triad_gait_note && <>Alteração Marcha — {data.triad_gait_note}<br/></>}
                    {data.triad_sphincter_note && <>Alterações esfincterianas — {data.triad_sphincter_note}<br/></>}
                    {data.triad_cognitive_note && <>Síndrome cognitiva — {data.triad_cognitive_note}<br/></>}
                    {data.clinicalHistory && <>{data.clinicalHistory}</>}
                  </td></tr>
                </tbody>
              </table>

              <div className="pv-sec">
                <div className="pv-sec-h">Teste de Marcha e Equilíbrio</div>
                <table className="pv-table" style={{marginTop:8}}>
                  <tbody>
                    <tr><td colSpan="3"><b>Timed Up and Go Test</b> — Observação do tempo que o paciente leva para andar 10 metros</td></tr>
                    <tr><td><b>Antes da PL:</b> {preTUG !== null ? `${preTUG} segundos` : "—"}</td><td colSpan="2"><b>Pós PL:</b> {posTUG !== null ? `${posTUG} segundos` : "—"}</td></tr>
                  </tbody>
                </table>
              </div>

              <div className="pv-sec">
                <table className="pv-table">
                  <thead><tr><th>Teste de Tinetti — Equilíbrio</th><th>Pré PL</th><th>Pós PL</th></tr></thead>
                  <tbody>
                    {renderTinettiRows(TINETTI_BALANCE, data.pre_bal, data.pos_bal)}
                    <tr style={{background:"#f0f0f0",fontWeight:700}}><td>Escore de equilíbrio</td><td className="center">{preBal}/{BAL_MAX}</td><td className="center">{posBal}/{BAL_MAX}</td></tr>
                  </tbody>
                </table>
              </div>

              <div className="pv-sec">
                <table className="pv-table">
                  <thead><tr><th>Teste de Tinetti — Marcha</th><th>Pré PL</th><th>Pós PL</th></tr></thead>
                  <tbody>
                    {renderTinettiRows(TINETTI_GAIT, data.pre_gait, data.pos_gait)}
                    <tr style={{background:"#f0f0f0",fontWeight:700}}><td>Escore de marcha</td><td className="center">{preGait}/{GAIT_MAX}</td><td className="center">{posGait}/{GAIT_MAX}</td></tr>
                    <tr style={{background:"#f0f0f0",fontWeight:700}}><td>Escore Total Tinetti</td><td className="center">{preTin}/{TIN_MAX}</td><td className="center">{posTin}/{TIN_MAX}</td></tr>
                  </tbody>
                </table>
              </div>

              <div className="pv-sec">
                <table className="pv-table">
                  <thead><tr><th>Referência</th><th>Tempo</th></tr></thead>
                  <tbody>
                    <tr><td>Alteração de Marcha</td><td>{V(data.triad_gait_time)}</td></tr>
                    <tr><td>Alteração esfincteriana</td><td>{V(data.triad_sphincter_time)}</td></tr>
                    <tr><td>Déficit Cognitivo Amnéstico</td><td>{V(data.triad_cognitive_time)}</td></tr>
                  </tbody>
                </table>
              </div>

              <div className="pv-sec">
                <div className="pv-sec-h">Neuroimagem</div>
                <table className="pv-table" style={{marginTop:8}}>
                  <tbody>
                    <tr><td colSpan="2"><b>RM de crânio</b> {data.mri_date && `— ${fmtDate(data.mri_date)}`}: MTA {V(data.mri_mta)} · Fazekas {V(data.mri_fazekas)}</td></tr>
                    <tr><td>Ângulo do corpo caloso</td><td>{V(data.mri_callosal)} {data.mri_callosal && "graus"}</td></tr>
                    <tr><td>DESH</td><td>{V(data.mri_desh)}</td></tr>
                    <tr><td>Índice de Evans</td><td>{V(data.mri_evans)}</td></tr>
                    {data.mri_notes && <tr><td colSpan="2">{data.mri_notes}</td></tr>}
                  </tbody>
                </table>
              </div>

              <div className="pv-sec">
                <table className="pv-table">
                  <thead><tr><th>RESUMO AVALIAÇÃO</th><th>Pré Punção Lombar</th><th>Pós Punção Lombar</th></tr></thead>
                  <tbody>
                    <tr><td><b>Timed Up and Go Test (TUG)</b></td><td className="center">{preTUG !== null ? `${preTUG} segundos` : "—"}</td><td className="center">{posTUG !== null ? `${posTUG} segundos` : "—"}</td></tr>
                    <tr><td><b>Escore de Tinetti</b></td><td className="center">{preTin}/{TIN_MAX}</td><td className="center">{posTin}/{TIN_MAX}</td></tr>
                  </tbody>
                </table>
              </div>

              <div className="pv-sec">
                <div className="pv-sec-h">Punção Lombar</div>
                <div style={{border:"1px solid #333",borderTop:0,padding:"8px 10px",fontSize:"11.5px",lineHeight:1.6}}>
                  Foi realizada punção lombar após antissepsia adequada e anestesia local com {data.pl_anesthesia || "lidocaína 2% sem vasoconstritor"}, paciente posicionado em DLE e puncionado espaço entre {data.pl_space || "L3-L4"} com agulha de PL nº{data.pl_needle || "22G"}, em {data.pl_attempts || "1"}ª tentativa com sucesso. Líquor aspecto {(data.pl_aspect || "água de rocha").toLowerCase()}. Pressão de abertura de {V(data.pl_pressure)}{data.pl_pressure && "cmH₂O"} com raquimanômetro. Coletado {V(data.pl_volume)}{data.pl_volume && " ml"} de líquor{data.pl_volume && " em 3 frascos e enviado para análise"}.
                  {data.pl_notes && <><br/>{data.pl_notes}</>}
                </div>
              </div>

              <div className="pv-sec">
                <div className="pv-sec-h">Conclusão</div>
                <div style={{border:"1px solid #333",borderTop:0,padding:"10px 12px",fontSize:"11.5px",lineHeight:1.7,whiteSpace:"pre-wrap"}}>
                  {data.conclusion || "—"}
                </div>
              </div>

              <div className="pv-foot">
                <p>À disposição,</p>
                <p style={{marginTop:20,whiteSpace:"pre-wrap"}}>{data.examiner}</p>
                <p style={{marginTop:12}}>Brasília, {fmtDate(data.evalDate)}</p>
              </div>
            </div>
          </div>
        );
      }

      /* ═══ PLAIN-TEXT REPORT (for clipboard copy) ═══ */
      function buildPlainReport(data, c) {
        const { preBal, preGait, preTin, posBal, posGait, posTin, preTUG, posTUG, resp } = c;
        const L = [];
        L.push("RELATÓRIO – TAP TEST");
        L.push("");
        L.push(`Nome: ${V(data.initials)}`);
        L.push(`Data Nasc.: ${fmtDate(data.birthdate)}  |  Idade: ${V(data.age)}  |  Sexo: ${V(data.gender)}  |  Escolaridade: ${V(data.schooling)}`);
        L.push(`Médico solicitante: ${V(data.requestingDoctor)}`);
        L.push(`Indicação: ${V(data.indication)}`);
        L.push(`Data da Avaliação: ${fmtDate(data.evalDate)}  |  Local: ${V(data.location)}`);
        L.push(`Comorbidades: ${V(data.comorbidities)}`);
        L.push(`Medicações em uso: ${V(data.medications)}`);
        L.push("");
        L.push("TIMED UP AND GO (10 m):");
        L.push(`  Pré PL: ${preTUG !== null ? preTUG + " s" : "—"}     Pós PL: ${posTUG !== null ? posTUG + " s" : "—"}`);
        L.push("");
        L.push(`TINETTI — Equilíbrio:  Pré ${preBal}/${BAL_MAX}   Pós ${posBal}/${BAL_MAX}`);
        L.push(`TINETTI — Marcha:      Pré ${preGait}/${GAIT_MAX}   Pós ${posGait}/${GAIT_MAX}`);
        L.push(`TINETTI — TOTAL:       Pré ${preTin}/${TIN_MAX}   Pós ${posTin}/${TIN_MAX}`);
        L.push("");
        L.push("NEUROIMAGEM:");
        L.push(`  RM ${fmtDate(data.mri_date)} — MTA ${V(data.mri_mta)} · Fazekas ${V(data.mri_fazekas)}`);
        L.push(`  Ângulo do corpo caloso: ${V(data.mri_callosal)}°`);
        L.push(`  DESH: ${V(data.mri_desh)}`);
        L.push(`  Índice de Evans: ${V(data.mri_evans)}`);
        L.push("");
        L.push("PUNÇÃO LOMBAR:");
        L.push(`  Espaço ${data.pl_space || "—"} · Agulha ${data.pl_needle || "—"} · Tentativas ${data.pl_attempts || "—"}`);
        L.push(`  Aspecto: ${data.pl_aspect || "—"} · Pressão de abertura: ${V(data.pl_pressure)} cmH₂O · Volume: ${V(data.pl_volume)} ml`);
        L.push("");
        L.push(`CONCLUSÃO: ${resp.label}`);
        L.push("");
        L.push(data.conclusion || "");
        L.push("");
        L.push(data.examiner);
        return L.join("\n");
      }

      /* ═══ MOUNT ═══ */
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<TapTestApp />);
    </script>
  </body>
</html>
